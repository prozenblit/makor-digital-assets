<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Makor Digital Assets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <base href="/hub/">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="top-nav">
  <span class="nav-back" onclick="window.location.href='index.html'">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M10 12L6 8l4-4"/>
    </svg>
    All assets
  </span>
  <span class="nav-divider">/</span>
  <span class="nav-title" id="nav-title">—</span>
</nav>

<div class="page" id="app"></div>

<script src="projects.js"></script>
<script>
  const hash = window.location.hash.replace("#", "");
  const parts = hash.split("/");
  const sectionKey = parts[0];
  let projectId, platformName;

  if (parts.length === 3) {
    // nested: platforms/makorxai/hr
    const platformId = parts[1];
    projectId = parts[2];
    const platform = (PROJECTS[sectionKey] || []).find(p => p.id === platformId);
    if (platform) platformName = platform.name;
  } else {
    projectId = parts[1];
  }

  const ICONS = {
    figma: `<svg viewBox="0 0 16 16" fill="currentColor"><path d="M5.5 2A1.5 1.5 0 0 0 4 3.5v2A1.5 1.5 0 0 0 5.5 7H7V5.5A1.5 1.5 0 0 0 5.5 4zm0-2A3.5 3.5 0 0 1 9 3.5V4h.5a3.5 3.5 0 0 1 0 7H9v.5a3.5 3.5 0 1 1-3.5-3.5H6V7h-.5A3.5 3.5 0 0 1 5.5 0zm0 8A1.5 1.5 0 0 0 4 9.5v.5h1.5A1.5 1.5 0 0 0 7 8.5V8H5.5zm3.5 0v.5A1.5 1.5 0 0 0 10.5 10H12V9.5A1.5 1.5 0 0 0 10.5 8H9zm1.5-2A1.5 1.5 0 0 0 12 4.5V4h-1.5A1.5 1.5 0 0 0 9 5.5V6h1.5z"/></svg>`,
    github: `<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>`,
    tokens: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>`,
    claude: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M2 8h8M2 12h10"/></svg>`,
    icons: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1l2 5h5l-4 3 1.5 5L8 11l-4.5 3L5 9 1 6h5z"/></svg>`,
    deck: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="3" width="14" height="10" rx="1"/><path d="M1 6h14"/></svg>`,
    excel: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="1"/><path d="M2 6h12M2 10h12M6 2v12"/></svg>`,
    doc: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 2H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V6l-3-4z"/><path d="M10 2v4h4"/></svg>`,
    css: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 2l-1 12 6 2 6-2-1-12H3z"/><path d="M5.5 6h5l-.5 4-2.5.5-2.5-.5-.2-2.5"/></svg>`,
    'html-ref': `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 2H4a1 1 0 00-1 1v10a1 1 0 001 1h8a1 1 0 001-1V6l-3-4z"/><path d="M10 2v4h4M5 8h6M5 11h4"/></svg>`,
    showcase: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="3" width="14" height="9" rx="1"/><path d="M5 12v2m6-2v2M3 14h10"/><circle cx="8" cy="7.5" r="2"/></svg>`,
    prototype: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="1" width="8" height="14" rx="2"/><path d="M6 13h4"/></svg>`
  };

  const ICON_CLASS = {
    figma: "icon-figma", github: "icon-github", tokens: "icon-tokens",
    claude: "icon-claude", icons: "icon-icons", deck: "icon-deck",
    excel: "icon-excel", doc: "icon-doc",
    css: "icon-css", "html-ref": "icon-html-ref", showcase: "icon-showcase", prototype: "icon-prototype"
  };

  const TYPE_LABELS = {
    figma: "Figma", github: "GitHub", tokens: "Tokens", claude: "Claude",
    css: "CSS", "html-ref": "HTML Ref", showcase: "Showcase", prototype: "Prototype",
    deck: "Deck", excel: "Excel", doc: "Doc"
  };

  function getProject() {
    const section = PROJECTS[sectionKey];
    if (!section) return null;
    if (platformName !== undefined) {
      // nested lookup: find app inside platform
      const platformId = parts[1];
      const platform = section.find(p => p.id === platformId);
      return platform ? (platform.apps || []).find(a => a.id === projectId) || null : null;
    }
    return section.find(p => p.id === projectId) || null;
  }

  function renderActions(actions) {
    return actions.map(a => {
      if (a.type === "open") {
        if (!a.url) return `<button class="btn btn-outline" disabled title="Link not added yet">Add link</button>`;
        return `<a href="${a.url}" target="_blank" rel="noopener" class="btn btn-primary">${a.label}</a>`;
      }
      if (a.type === "download") {
        return `<a href="${a.url}" download="${a.filename || ""}" class="btn btn-outline">${a.label}</a>`;
      }
      if (a.type === "view") {
        return `<a href="${a.url}" target="_blank" rel="noopener" class="btn btn-ghost">${a.label}</a>`;
      }
      if (a.type === "copy") {
        return `<button class="btn btn-ghost" onclick="copyToClipboard('${a.url}')">${a.label}</button>`;
      }
      if (a.type === "disabled") {
        return `<button class="btn btn-disabled" disabled>${a.label}</button>`;
      }
      return "";
    }).join("");
  }

  function render() {
    const project = getProject();
    const app = document.getElementById("app");

    if (!project) {
      app.innerHTML = `<div class="empty-state">Project not found.</div>`;
      return;
    }

    document.title = `${project.name} — Makor Digital Assets`;
    if (platformName) {
      document.getElementById("nav-title").textContent = project.name;
      const divider = document.querySelector(".nav-divider");
      divider.insertAdjacentHTML("afterend",
        `<span class="nav-crumb">${platformName}</span><span class="nav-divider">/</span>`
      );
    } else {
      document.getElementById("nav-title").textContent = project.name;
    }

    const isPlaceholder = project.status === "placeholder";

    let html = `
      <div class="project-hero">
        <div>
          <div class="project-hero-name">${project.name}</div>
          <div class="project-hero-desc">${project.description}</div>
        </div>
      </div>
    `;

    if (isPlaceholder) {
      html += `<div class="placeholder-notice">This section is being set up. Check back soon.</div>`;
    }

    if (project.assets.length === 0) {
      html += `<div class="empty-state">No assets yet — content coming soon.</div>`;
    } else {
      // Filter chips
      const types = [...new Set(project.assets.map(a => a.type))];
      if (types.length > 1) {
        const chips = types.map(t => {
          const count = project.assets.filter(a => a.type === t).length;
          const label = TYPE_LABELS[t] || t;
          return `<button class="filter-chip" data-type="${t}">
            <span class="chip-dot" style="background:var(--type-${t}, #aaa)"></span>
            ${label} <span style="opacity:0.55;font-weight:400">${count}</span>
          </button>`;
        });
        html += `<div class="filter-bar" id="filter-bar">
          <button class="filter-chip active" data-type="all">All <span style="opacity:0.55;font-weight:400">${project.assets.length}</span></button>
          ${chips.join('')}
        </div>`;
      }

      html += `<div class="assets-label">Assets</div><div class="assets-list">`;
      project.assets.forEach(asset => {
        const iconKey = asset.type in ICONS ? asset.type : "doc";
        const typeLabel = TYPE_LABELS[iconKey] || iconKey;
        const isCopyable = ['claude', 'html-ref', 'tokens', 'css'].includes(asset.type);
        const copyUrl = asset.actions && asset.actions.find(a => a.type === 'view' || a.type === 'download')?.url;
        const copyBtn = isCopyable && copyUrl
          ? `<button class="btn btn-ghost" onclick="copyFile('${copyUrl}', this)" title="Copy file contents to clipboard">Copy</button>`
          : '';
        html += `
          <div class="asset-card type-${iconKey}" data-type="${iconKey}">
            <div class="asset-left">
              <div class="asset-icon ${ICON_CLASS[iconKey] || "icon-doc"}">
                ${ICONS[iconKey]}
              </div>
              <div class="asset-info">
                <div class="asset-name-row">
                  <div class="asset-name">${asset.name}</div>
                  <span class="type-chip type-chip-${iconKey}">${typeLabel}</span>
                </div>
                <div class="asset-desc">${asset.description}</div>
                ${asset.note ? `<div class="asset-note">⚠ ${asset.note}</div>` : ""}
              </div>
            </div>
            <div class="asset-actions">
              ${renderActions(asset.actions)}${copyBtn}
            </div>
          </div>
        `;
      });
      html += `</div>`;
    }

    app.innerHTML = html;
  }

  function copyToClipboard(url) {
    fetch(url)
      .then(r => r.text())
      .then(text => {
        navigator.clipboard.writeText(text);
        alert("Copied to clipboard.");
      });
  }

  function copyFile(url, btn) {
    const original = btn.textContent;
    btn.disabled = true;
    fetch(url)
      .then(r => r.text())
      .then(text => {
        navigator.clipboard.writeText(text);
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 2000);
      })
      .catch(() => { btn.textContent = 'Error'; btn.disabled = false; });
  }

  function initFilters() {
    const bar = document.getElementById('filter-bar');
    if (!bar) return;
    bar.addEventListener('click', e => {
      const chip = e.target.closest('.filter-chip');
      if (!chip) return;
      bar.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      const type = chip.dataset.type;
      document.querySelectorAll('.asset-card').forEach(card => {
        card.style.display = (type === 'all' || card.dataset.type === type) ? '' : 'none';
      });
    });
  }

  render();
  initFilters();
</script>
</body>
</html>
